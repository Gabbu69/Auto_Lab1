<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty Card Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvas {
            display: none;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .result.warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result p {
            margin: 5px 0;
            font-size: 14px;
        }

        .result .points {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .rewards-unlocked {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
        }

        .rewards-unlocked h4 {
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        .reward-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            font-weight: 600;
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #666;
        }

        .manual-input {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .manual-input h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="number"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Loyalty Card Scanner</h1>
            <p>Scan QR code to earn points</p>
        </div>

        <div class="content">
            <div id="video-container">
                <video id="video" autoplay playsinline></video>
                <div class="scan-overlay"></div>
            </div>
            <canvas id="canvas"></canvas>

            <div class="controls">
                <button id="startBtn">Start Camera</button>
                <button id="stopBtn" style="display: none;">Stop Camera</button>
            </div>

            <div class="status" id="status">Click "Start Camera" to begin scanning</div>

            <div id="result" class="result"></div>

            <div class="manual-input">
                <h3>Manual Entry (for testing)</h3>
                <div class="input-group">
                    <input type="text" id="manualToken" placeholder="Card Token (e.g., ABC123XYZ0)">
                    <input type="number" id="manualAmount" placeholder="Amount (₱)" min="0" step="10">
                </div>
                <button onclick="manualScan()">Submit Scan</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        let stream = null;
        let scanning = false;
        let scanPaused = false;

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                scanning = true;
                scanPaused = false;
                
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                status.textContent = 'Camera active - Point at QR code';
                
                requestAnimationFrame(tick);
            } catch (error) {
                console.error('Camera error:', error);
                status.textContent = 'Error: Could not access camera';
                showResult('error', 'Camera Error', 'Please allow camera access and try again.');
            }
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            status.textContent = 'Camera stopped';
        }

        function tick() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA && !scanPaused) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    handleQRCode(code.data);
                }
            }

            requestAnimationFrame(tick);
        }

        async function handleQRCode(qrData) {
            console.log('QR detected:', qrData);
            
            // Extract token from URL (format: https://loyalty.example.com/card/TOKEN)
            const match = qrData.match(/\/card\/([A-Za-z0-9]+)/);
            if (!match) {
                showResult('error', 'Invalid QR Code', 'This QR code is not a valid loyalty card.');
                return;
            }

            const token = match[1];
            scanPaused = true;
            status.textContent = 'Processing scan...';

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_token: token, amount: 100 })
                });

                const data = await response.json();

                if (response.ok) {
                    showScanSuccess(data);
                } else if (response.status === 429) {
                    showResult('warning', 'Please Wait', data.message);
                } else {
                    showResult('error', 'Scan Failed', data.message || 'Unknown error');
                }
            } catch (error) {
                console.error('Scan error:', error);
                showResult('error', 'Network Error', 'Could not connect to server');
            }

            // Resume scanning after 3 seconds
            setTimeout(() => {
                scanPaused = false;
                status.textContent = 'Ready to scan';
                result.style.display = 'none';
            }, 3000);
        }

        function showScanSuccess(data) {
            const customerName = data.customer_name || 'Customer';
            let html = `
                <h3>✓ Scan Successful!</h3>
                <p><strong>Customer:</strong> ${customerName}</p>
                <p><strong>Points Awarded:</strong> +${data.points_awarded}</p>
                <div class="points">${data.new_points_balance} points</div>
            `;

            if (data.rewards_unlocked && data.rewards_unlocked.length > 0) {
                html += '<div class="rewards-unlocked">';
                html += '<h4>🎉 New Rewards Unlocked!</h4>';
                data.rewards_unlocked.forEach(reward => {
                    html += `<div class="reward-item">${reward.name} - ${reward.description}</div>`;
                });
                html += '</div>';
            }

            result.className = 'result success';
            result.innerHTML = html;
            result.style.display = 'block';
            status.textContent = 'Scan complete!';
        }

        function showResult(type, title, message) {
            result.className = `result ${type}`;
            result.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
            result.style.display = 'block';
        }

        async function manualScan() {
            const token = document.getElementById('manualToken').value.trim();
            const amount = parseFloat(document.getElementById('manualAmount').value) || 100;

            if (!token) {
                showResult('error', 'Invalid Input', 'Please enter a card token');
                return;
            }

            status.textContent = 'Processing manual scan...';

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_token: token, amount })
                });

                const data = await response.json();

                if (response.ok) {
                    showScanSuccess(data);
                } else if (response.status === 429) {
                    showResult('warning', 'Please Wait', data.message);
                } else {
                    showResult('error', 'Scan Failed', data.message || 'Unknown error');
                }
            } catch (error) {
                console.error('Manual scan error:', error);
                showResult('error', 'Network Error', 'Could not connect to server');
            }
        }
    </script>
</body>
</html>
